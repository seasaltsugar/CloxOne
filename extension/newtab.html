<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>CloxOne</div>
    <div class="top-actions">
      <button id="btn-settings" class="ghost" type="button"></button>
      <button id="btn-add" class="ghost" type="button"></button>
    </div>
  </header>

  <main id="board-wrap">
    <div id="board" role="grid" aria-label="Time zones"></div>
  </main>

  <div id="tip-banner" class="tip-banner" role="status" hidden></div>

  <footer class="footer">
    <span class="privacy-pill" title="CloxOne makes zero network requests">
      <span class="dot" aria-hidden="true"></span>Private by design · zero network requests · nothing leaves this device
    </span>
    <span class="footer-links">
      <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
      <a id="kofi-footer" class="kofi" target="_blank" rel="noopener"></a>
    </span>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/cities-data.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/search.js"></script>
  <script src="js/time.js"></script>
  <script src="js/holidays-data.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/license.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
